<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Journey planner and schedules for Bangalore Namma Metro">
    <meta name="theme-color" content="#9B59B6">
    <title>Bangalore Metro Timings</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/components.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
</head>
<body>
    <div class="app-container">
        <!-- Tab Navigation -->
        <nav>
            <div class="container">
                <div class="flex">
                    <button class="tab-button" data-tab="journey-planner">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                        </svg>
                        <span>Journey Planner</span>
                    </button>
                    <button class="tab-button active" data-tab="next-train">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Next Train</span>
                    </button>
                    <button class="tab-button" data-tab="schedule-viewer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span>Schedules</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main>
            <!-- Loading State -->
            <div id="loadingState" class="loading-spinner">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-purple-600 border-t-transparent"></div>
                <p class="mt-4 text-gray-600">Loading metro data...</p>
            </div>

            <!-- Tab Panels -->
            <div id="tabContent" class="hidden">
                <!-- Journey Planner Tab -->
                <div id="journey-planner-panel" class="tab-panel hidden">
                    <journey-planner></journey-planner>
                </div>

                <!-- Next Train Tab -->
                <div id="next-train-panel" class="tab-panel active">
                    <next-train></next-train>
                </div>

                <!-- Schedule Viewer Tab -->
                <div id="schedule-viewer-panel" class="tab-panel hidden">
                    <schedule-viewer></schedule-viewer>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <div class="container text-center text-sm text-gray-600">
                <p>&copy; 2026 Bangalore Metro Timings</p>
                <p class="mt-2">Data last updated: <span id="lastUpdated">-</span></p>
                <p class="mt-2 text-xs text-gray-500">All timings are approximate. Please verify at stations.</p>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
